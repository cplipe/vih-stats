name: Actualizar estadísticas

on:
  # La ejecución periódica la dispara cron-job.org cada 15 minutos (workflow_dispatch).
  # El horario interno de GitHub queda solo como respaldo, cada 1 hora.
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch: # cron-job.org y el botón "Run workflow" usan esto

permissions:
  contents: write

concurrency:
  group: actualizar-stats
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos del clan
        run: python scripts/colector.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name  "vih-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en las estadísticas"
          else
            git commit -m "Actualizar stats $(date -u +'%Y-%m-%d %H:%M') UTC"
            # Si otro cambio llegó al repo mientras corría, se integra y se reintenta
            for i in 1 2 3; do
              git push && exit 0
              echo "Push rechazado, reintentando ($i/3)..."
              git pull --rebase -X theirs origin main || git rebase --abort
              sleep 5
            done
            exit 1
          fi
