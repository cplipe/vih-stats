name: Actualizar estadísticas

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-stats
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos del clan
        run: python scripts/colector.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name  "vih-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en las estadísticas"
          else
            git commit -m "Actualizar stats $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
